*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--fond);color:var(--encre);font-family:var(--sans);line-height:1.6;font-size:16px}
a{color:var(--accent)}
img{display:block}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
/* ---------- entête ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(250,239,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(92,98,121,.14)}
.head-in{max-width:680px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:.02em;color:var(--accent);text-decoration:none;line-height:1.1}
.langs{display:flex;gap:2px}
.langs button{min-width:42px;min-height:44px;border:none;background:transparent;border-radius:12px;font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--accent);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--fond)}
/* ---------- motifs typographiques du site ---------- */
.surtitre{font-family:var(--sans);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--sauge)}
.surtitre em{font-style:normal;color:var(--accent-clair)}
h1.grand,h2.grand{font-family:var(--serif);font-weight:600;color:var(--accent);line-height:1.12}
/* ---------- bandeaux photo ---------- */
.bandeau{border-radius:var(--rayon);overflow:hidden;box-shadow:0 8px 26px rgba(92,98,121,.16);margin:16px 0}
.bandeau img{width:100%;aspect-ratio:15/8;object-fit:cover}
/* ---------- accueil ---------- */
.hero{padding:26px 0 4px;text-align:center}
.hero h1{font-size:2.4rem}
.hero .adr{margin-top:4px;font-size:.9rem;opacity:.8}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.fact{background:var(--carte);border:1px solid rgba(92,98,121,.14);border-radius:14px;padding:8px 14px;box-shadow:0 2px 8px rgba(92,98,121,.07)}
.fact b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sauge);font-weight:700}
.fact span{font-size:.95rem;font-weight:600}
.wifi{background:var(--accent);color:var(--fond);border-radius:var(--rayon);padding:18px;margin:18px 0;box-shadow:0 8px 22px rgba(92,98,121,.28)}
.wifi h2{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.wifi .lig{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(250,239,230,.25)}
.wifi .lig b{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700}
.wifi .val{font-size:1.05rem;font-weight:600;user-select:all;text-align:right}
.wifi button{min-height:46px;border:none;border-radius:13px;background:var(--fond);color:var(--accent);font-weight:700;font-size:.88rem;padding:0 16px;cursor:pointer;width:100%;margin-top:12px}
.menu{margin:26px 0 8px}
.menu .surtitre{text-align:center;display:block;margin-bottom:12px}
.carte-nav{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid rgba(92,98,121,.12);border-radius:var(--rayon);box-shadow:0 3px 12px rgba(92,98,121,.07);padding:16px;margin-bottom:10px;text-decoration:none;min-height:64px}
.carte-nav .ico{font-size:1.5rem;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(184,191,208,.18);border-radius:14px}
.carte-nav .tt{flex:1}
.carte-nav h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--accent);line-height:1.15}
.carte-nav .hint{font-size:.82rem;color:var(--encre);opacity:.72}
.carte-nav .chev{flex:none;color:var(--accent-clair);font-size:1.4rem}
/* ---------- pages ---------- */
.retour{position:sticky;top:64px;z-index:9;padding:10px 0}
.retour button{min-height:44px;border:1px solid rgba(92,98,121,.18);background:var(--carte);color:var(--accent);border-radius:22px;padding:0 18px;font-size:.88rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(92,98,121,.10)}
.page-tete{margin:6px 0 2px}
.page-tete h1{font-size:2rem;margin-top:2px}
.page-tete .lead{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--accent);margin-top:8px}
.corps h3{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:var(--accent);margin:18px 0 4px}
.corps p{margin:8px 0}
.corps ul{margin:6px 0;list-style:none}
.corps ul li{padding:6px 0 6px 24px;position:relative}
.corps ul li::before{content:"•";position:absolute;left:8px;color:var(--sauge);font-weight:700}
.corps .note{margin:14px 0;font-size:.9rem;background:rgba(184,191,208,.18);border-radius:14px;padding:12px 14px}
/* ---------- autour ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;min-height:44px;border:1px solid rgba(92,98,121,.2);background:var(--carte);border-radius:22px;padding:0 15px;font-size:.86rem;font-weight:600;color:var(--encre);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--fond)}
.cherche{width:100%;min-height:46px;border:1px solid rgba(92,98,121,.2);border-radius:14px;background:var(--carte);padding:0 14px;font-size:1rem;color:var(--encre);margin-bottom:12px}
.cherche:focus{outline:2px solid var(--accent)}
.lieu{background:var(--carte);border:1px solid rgba(92,98,121,.12);border-radius:var(--rayon);padding:15px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(92,98,121,.05)}
.lieu .lt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lieu h3{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--accent);line-height:1.2}
.lieu .dist{flex:none;font-size:.78rem;font-weight:700;color:var(--sauge);white-space:nowrap}
.lieu p{font-size:.93rem;margin:5px 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a{flex:1 1 auto;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:13px;font-size:.86rem;font-weight:700;padding:0 12px}
.actions a.prim{background:var(--accent);color:var(--fond)}
.actions a.sec{background:rgba(184,191,208,.22);color:var(--accent)}
.vide{text-align:center;padding:24px;opacity:.7}
.approx{font-size:.78rem;text-align:center;opacity:.6;margin:10px 0 6px}
/* ---------- pied ---------- */
footer{margin-top:34px;background:var(--accent);color:var(--fond)}
.foot-in{max-width:680px;margin:0 auto;padding:30px 20px 34px;text-align:center}
footer .surtitre{color:rgba(250,239,230,.7)}
footer h2{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin:4px 0 2px}
footer .fl{font-size:.92rem;opacity:.9;margin-bottom:16px}
footer .factions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
footer .factions a{min-height:46px;display:flex;align-items:center;gap:6px;padding:0 18px;border-radius:13px;background:rgba(250,239,230,.14);color:var(--fond);text-decoration:none;font-weight:700;font-size:.88rem}
footer .avis{display:block;background:var(--fond);color:var(--accent);border-radius:13px;padding:13px;font-weight:700;text-decoration:none;margin:0 auto 16px;max-width:340px}
footer .adr2{font-size:.85rem;opacity:.85}
footer .sig{font-family:var(--serif);font-style:italic;font-size:1.15rem;margin-top:14px;opacity:.92}
@media(min-width:560px){.hero h1{font-size:2.9rem}.page-tete h1{font-size:2.5rem}}
</style>
</head>

:["Unheated pool, 1.50 m deep","The hot tub is privatised room by room: ask for your slot","No running around the pool, no diving, no glass nearby","Children must always be accompanied by an adult","Pool towels provided"],"note":"The pool may close temporarily for safety, weather or maintenance reasons."},{"h":"Fitness room","p":["Air-conditioned, free access from 8 am to 8 pm."]},{"h":"House habits","ul":["Quiet appreciated from 9 pm — the neighbours and the cicadas thank you","Non-smoking house: a smoking area awaits you outside","No pets","No barbecue","Meals in your room: welcome","Your visitors are welcome during the day — just tell your hosts"]}]},{"id":"securite","ico":"🆘","t":"Safety & health","hint":"Emergencies: 112","lead":"Useful numbers and reflexes — hoping you will never need them.","b":[{"h":"Emergency numbers","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: European emergency number · 15: ambulance (SAMU) · 18: fire brigade · 114: by SMS (hearing-impaired)","In case of evacuation, assembly point: the entrance of the property"]},{"h":"Health nearby","ul":["Peyron medical practice (600 m): +33 4 93 24 94 88","Peyron pharmacy (600 m): +33 4 93 24 90 14 · duty pharmacy: 3237","24/7 emergency room: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Children’s emergencies: CHU-Lenval, Nice — call 15 first","Baous veterinary clinic (1 km): +33 4 93 59 30 72"]},{"h":"Summer on the Riviera","ul":["Forest fire risk: access to the hills may be restricted, check before hiking","Heat waves: carry water, avoid effort in the hottest hours","River swimming: be careful, water levels can rise quickly"]}]},{"id":"depart","ico":"👋","t":"Departure day","hint":"Before 11 am","lead":"Vacate the room between 8:30 and 11 am — and leave with a light heart.","b":[{"ul":["Tell us your approximate departure time","Windows closed, air conditioning off","Hand us the keys, or drop them in the key box","The bins? We take care of them","Nothing else: you are our guests until the very last minute"]},{"note":"A review of your stay helps us enormously — the link is at the bottom of the page. Thank you!"}]}],"es":[{"id":"bienvenue","ico":"🌿","t":"Bienvenidos","hint":"Julien & Stéphanie","lead":"Nos complace recibirles en nuestro remanso de paz, donde cada detalle está pensado para que su estancia sea tan agradable como memorable.","b":[{"p":["Situada al pie del pueblo encaramado de Saint-Jeannet, en el interior de Niza, nuestra casa de huéspedes invita al descanso y al descubrimiento. Cerca de Niza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer y Grasse, disfrutarán de un entorno preservado entre mar y montaña.","Bienvenidos a nuestro sueño. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"Llegada y salida","hint":"15 – 19 h · 8:30 – 11 h","lead":"Dos horarios que recordar y un mensaje que nos ayuda mucho.","b":[{"ul":["Llegada de 15:00 a 19:00","Salida de 8:30 a 11:00","Aparcamiento privado: 3 plazas en la propiedad"]},{"h":"Las llaves","p":["Les recibimos en persona; según su hora de llegada, las llaves pueden esperarles en la caja de llaves. Sin códigos que recordar: si lo necesitan, llámennos al +33 6 72 87 16 97."]},{"h":"Avísennos","p":["Una palabra sobre su hora aproximada de llegada nos ayuda mucho. Una llegada más tardía es posible en caso de imprevisto: avísennos lo antes posible."]}]},{"id":"chambres","ico":"🛏️","t":"Las habitaciones","hint":"La Suite · Baou · Château","lead":"Tres habitaciones, cada una con su carácter — y una cuarta, Provence, próximamente.","b":[{"h":"La Suite — 2.ª planta","p":["Unos 50 m², dormitorio independiente, salón y cocina totalmente equipada. Cama de 160 × 200 cm, terraza privada de 25 m² con vistas al castillo y al Baou de Saint-Jeannet."]},{"h":"Habitación Baou — 1.ª planta","p":["Unos 45 m², ambiente vegetal «Jungle», chimenea funcional (pídannos leña), balcón privado, cama king size de 180 × 200 cm."]},{"h":"Habitación Château — 1.ª planta","p":["Unos 40 m², espíritu loft con vista directa al castillo vecino, balcón privado, ducha a ras de suelo, cama king size de 180 × 200 cm."]},{"h":"En todas las habitaciones","ul":["Aire acondicionado reversible","Televisión con Netflix","Enchufes USB-C y USB","Cafetera de cápsulas, hervidor y selección de tés","Secador de pelo, toallas incluidas","Limpieza diaria","Equipamiento para bebés bajo petición: cuna de viaje, bañera, trona, cambiador"]},{"note":"El agua caliente proviene de un termo: nada que ajustar, todo está listo."}]},{"id":"repas","ico":"🥐","t":"Desayuno y caprichos","hint":"8 – 10 h, incluido","lead":"El desayuno está incluido en su estancia.","b":[{"ul":["Servido en la cocina, de 8:00 a 10:00","Tabla de degustación de productos locales: 40 €, al mediodía o como aperitivo, reservando la víspera","Dietas especiales (vegetariana, sin gluten, alergias): dígannoslo y nos adaptamos"]},{"note":"No hay otra restauración en la casa, pero sí una excelente dirección a 300 m a pie — vean «Qué ver cerca»."}]},{"id":"regles","ico":"🌸","t":"La casa","hint":"Piscina 8 – 20 h · silencio desde las 21 h","lead":"Algunas pautas para que todos disfruten de una bonita estancia.","b":[{"h":"Piscina y jacuzzi — de 8 a 20 h","ul":["Piscina sin climatizar, 1,50 m de profundidad","El jacuzzi se privatiza habitación por habitación: pidan su turno","No correr alrededor de la piscina, no tirarse de cabeza, nada de vidrio cerca","Los niños siempre acompañados por un adulto","Toallas de piscina incluidas"],"note":"La piscina puede cerrar temporalmente por seguridad, meteorología o mantenimiento."},{"h":"Gimnasio","p":["Climatizado, de libre acceso de 8 a 20 h."]},{"h":"Las costumbres","ul":["Se agradece el silencio a partir de las 21 h — los vecinos y las cigarras lo agradecen","Casa de no fumadores: hay una zona de fumadores en el exterior","No se admiten mascotas","Barbacoa no permitida","Comidas en la habitación: bienvenidas","Sus visitas son bienvenidas durante el día — basta con avisar a los anfitriones"]}]},{"id":"securite","ico":"🆘","t":"Seguridad y salud","hint":"Emergencias: 112","lead":"Los números y reflejos útiles — esperando que nunca los necesiten.","b":[{"h":"Números de emergencia","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: emergencias europeas · 15: SAMU · 18: bomberos · 114: por SMS (personas sordas)","En caso de evacuación, punto de encuentro: la entrada de la propiedad"]},{"h":"Salud muy cerca","ul":["Consultorio médico du Peyron (600 m): +33 4 93 24 94 88","Farmacia du Peyron (600 m): +33 4 93 24 90 14 · farmacia de guardia: 3237","Urgencias 24 h: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Urgencias infantiles: CHU-Lenval, Niza — llamen primero al 15","Veterinario des Baous (1 km): +33 4 93 59 30 72"]},{"h":"El verano en la Costa Azul","ul":["Riesgo de incendios forestales: el acceso a los montes puede estar regulado, infórmense antes de una excursión","Olas de calor: lleven agua y eviten el esfuerzo en las horas más calurosas","Baño en río: prudencia, el caudal puede subir rápidamente"]}]},{"id":"depart","ico":"👋","t":"El día de la salida","hint":"Antes de las 11 h","lead":"Dejen la habitación entre las 8:30 y las 11 h — y márchense con el corazón ligero.","b":[{"ul":["Dígannos su hora aproximada de salida","Ventanas cerradas, aire acondicionado apagado","Entréguennos las llaves en mano o déjenlas en la caja de llaves","¿La basura? Nos encargamos nosotros","Nada más: son nuestros huéspedes hasta el último minuto"]},{"note":"Una opinión sobre su estancia nos ayuda muchísimo — el enlace está al pie de página. ¡Gracias!"}]}],"de":[{"id":"bienvenue","ico":"🌿","t":"Willkommen","hint":"Julien & Stéphanie","lead":"Wir freuen uns, Sie in unserer Oase der Ruhe zu empfangen, in der jedes Detail dazu gedacht ist, Ihren Aufenthalt so angenehm wie unvergesslich zu machen.","b":[{"p":["Am Fuße des Bergdorfs Saint-Jeannet, im Hinterland von Nizza gelegen, lädt unser Gästehaus zum Entspannen und Entdecken ein. In der Nähe von Nizza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer und Grasse genießen Sie eine geschützte Umgebung zwischen Meer und Bergen.","Willkommen in unserem Traum. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"An- & Abreise","hint":"15 – 19 Uhr · 8:30 – 11 Uhr","lead":"Zwei Uhrzeiten zum Merken – und eine Nachricht, die uns sehr hilft.","b":[{"ul":["Anreise von 15:00 bis 19:00 Uhr","Abreise von 8:30 bis 11:00 Uhr","Privatparkplatz: 3 Stellplätze auf dem Grundstück"]},{"h":"Die Schlüssel","p":["Wir empfangen Sie persönlich; je nach Ankunftszeit können die Schlüssel im Schlüsselkasten auf Sie warten. Kein Code zu merken: rufen Sie uns bei Bedarf unter +33 6 72 87 16 97 an."]},{"h":"Sagen Sie uns Bescheid","p":["Ein kurzes Wort zu Ihrer ungefähren Ankunftszeit hilft uns sehr. Eine spätere Ankunft ist bei Unvorhergesehenem möglich – geben Sie uns einfach so früh wie möglich Bescheid."]}]},{"id":"chambres","ico":"🛏️","t":"Die Zimmer","hint":"La Suite · Baou · Château","lead":"Drei Zimmer, jedes mit eigenem Charakter – und ein viertes, Provence, folgt bald.","b":[{"h":"La Suite — 2. Etage","p":["Rund 50 m², separates Schlafzimmer, Wohnzimmer und voll ausgestattete Küche. Bett 160 × 200 cm, private 25-m²-Dachterrasse mit Blick auf das Schloss und den Baou von Saint-Jeannet."]},{"h":"Zimmer Baou — 1. Etage","p":["Rund 45 m², grüne „Jungle“-Atmosphäre, funktionierender Kamin (fragen Sie uns nach Holz), privater Balkon, Kingsize-Bett 180 × 200 cm."]},{"h":"Zimmer Château — 1. Etage","p":["Rund 40 m², Loft-Charakter mit direktem Blick auf das benachbarte Schloss, privater Balkon, ebenerdige Dusche, Kingsize-Bett 180 × 200 cm."]},{"h":"In allen Zimmern","ul":["Klimaanlage (heizen & kühlen)","Fernseher mit Netflix","USB-C- und USB-Anschlüsse","Kapselmaschine, Wasserkocher und Teeauswahl","Föhn, Handtücher inklusive","Tägliche Reinigung","Babyausstattung auf Anfrage: Reisebett, Babywanne, Hochstuhl, Wickelauflage"]},{"note":"Das warme Wasser kommt aus einem Boiler: nichts einzustellen, alles ist bereit."}]},{"id":"repas","ico":"🥐","t":"Frühstück & Genuss","hint":"8 – 10 Uhr, inklusive","lead":"Das Frühstück ist im Aufenthalt inbegriffen.","b":[{"ul":["Serviert in der Küche, von 8:00 bis 10:00 Uhr","Verkostungsplatte mit regionalen Produkten: 40 €, mittags oder zum Aperitif, Reservierung am Vortag","Besondere Ernährung (vegetarisch, glutenfrei, Allergien): sagen Sie uns Bescheid, wir passen uns an"]},{"note":"Keine weitere Verpflegung im Haus, aber eine ausgezeichnete Adresse 300 m zu Fuß entfernt – siehe „In der Umgebung“."}]},{"id":"regles","ico":"🌸","t":"Das Haus","hint":"Pool 8 – 20 Uhr · Ruhe ab 21 Uhr","lead":"Ein paar Hinweise, damit alle einen schönen Aufenthalt haben.","b":[{"h":"Pool & Whirlpool — 8 bis 20 Uhr","ul":["Unbeheizter Pool, 1,50 m tief","Der Whirlpool wird zimmerweise privatisiert: fragen Sie nach Ihrem Zeitfenster","Nicht am Beckenrand rennen, nicht springen, kein Glas in Beckennähe","Kinder immer in Begleitung eines Erwachsenen","Poolhandtücher werden gestellt"],"note":"Der Pool kann aus Sicherheits-, Wetter- oder Wartungsgründen vorübergehend schließen."},{"h":"Fitnessraum","p":["Klimatisiert, freier Zugang von 8 bis 20 Uhr."]},{"h":"Die Gepflogenheiten","ul":["Ruhe ab 21 Uhr willkommen – Nachbarn und Zikaden danken es Ihnen","Nichtraucherhaus: ein Raucherbereich erwartet Sie im Freien","Keine Haustiere","Grillen nicht gestattet","Mahlzeiten im Zimmer: gern","Ihr Besuch ist tagsüber willkommen – ein Wort an die Gastgeber genügt"]}]},{"id":"securite","ico":"🆘","t":"Sicherheit & Gesundheit","hint":"Notruf: 112","lead":"Nützliche Nummern und Hinweise – in der Hoffnung, dass Sie sie nie brauchen.","b":[{"h":"Notrufnummern","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: europäischer Notruf · 15: Rettungsdienst (SAMU) · 18: Feuerwehr · 114: per SMS (hörgeschädigt)","Im Evakuierungsfall Sammelpunkt: die Einfahrt des Grundstücks"]},{"h":"Gesundheit ganz nah","ul":["Arztpraxis du Peyron (600 m): +33 4 93 24 94 88","Apotheke du Peyron (600 m): +33 4 93 24 90 14 · Notdienst-Apotheke: 3237","Notaufnahme rund um die Uhr: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 Min.): +33 4 92 13 53 13","Kindernotfälle: CHU-Lenval, Nizza – rufen Sie zuerst die 15 an","Tierarztpraxis des Baous (1 km): +33 4 93 59 30 72"]},{"h":"Sommer an der Côte d’Azur","ul":["Waldbrandgefahr: der Zugang zu den Bergen kann eingeschränkt sein, informieren Sie sich vor einer Wanderung","Hitzewellen: Wasser mitnehmen, Anstrengung in den heißesten Stunden vermeiden","Baden im Fluss: Vorsicht, der Pegel kann schnell steigen"]}]},{"id":"depart","ico":"👋","t":"Der Abreisetag","hint":"Vor 11 Uhr","lead":"Geben Sie das Zimmer zwischen 8:30 und 11 Uhr frei – und reisen Sie mit leichtem Herzen ab.","b":[{"ul":["Nennen Sie uns Ihre ungefähre Abreisezeit","Fenster geschlossen, Klimaanlage aus","Geben Sie uns die Schlüssel persönlich oder legen Sie sie in den Schlüsselkasten","Der Müll? Darum kümmern wir uns","Sonst nichts: Sie sind bis zur letzten Minute unsere Gäste"]},{"note":"Eine Bewertung Ihres Aufenthalts hilft uns sehr – der Link steht unten auf der Seite. Danke!"}]}],"it":[{"id":"bienvenue","ico":"🌿","t":"Benvenuti","hint":"Julien & Stéphanie","lead":"Siamo felici di accogliervi nel nostro angolo di pace, dove ogni dettaglio è pensato per rendere il vostro soggiorno piacevole e indimenticabile.","b":[{"p":["Ai piedi del borgo arroccato di Saint-Jeannet, nell’entroterra di Nizza, la nostra maison d’hôtes invita al relax e alla scoperta. Vicino a Nizza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer e Grasse, godrete di un ambiente preservato tra mare e montagna.","Benvenuti nel nostro sogno. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"Arrivo e partenza","hint":"15 – 19 · 8:30 – 11","lead":"Due orari da ricordare e un messaggio che ci aiuta molto.","b":[{"ul":["Arrivo dalle 15:00 alle 19:00","Partenza dalle 8:30 alle 11:00","Parcheggio privato: 3 posti nella proprietà"]},{"h":"Le chiavi","p":["Vi accogliamo di persona; a seconda dell’orario di arrivo, le chiavi possono attendervi nella cassetta delle chiavi. Nessun codice da ricordare: in caso di bisogno, chiamateci al +33 6 72 87 16 97."]},{"h":"Avvisateci","p":["Una parola sul vostro orario approssimativo di arrivo ci è di grande aiuto. Un arrivo più tardi resta possibile in caso di imprevisto: avvisateci appena potete."]}]},{"id":"chambres","ico":"🛏️","t":"Le camere","hint":"La Suite · Baou · Château","lead":"Tre camere, ognuna con il suo carattere — e una quarta, Provence, in arrivo.","b":[{"h":"La Suite — 2º piano","p":["Circa 50 m², camera indipendente, salotto e cucina completamente attrezzata. Letto 160 × 200 cm, terrazza privata di 25 m² con vista sul castello e sul Baou di Saint-Jeannet."]},{"h":"Camera Baou — 1º piano","p":["Circa 45 m², atmosfera vegetale «Jungle», camino funzionante (chiedeteci la legna), balcone privato, letto king size 180 × 200 cm."]},{"h":"Camera Château — 1º piano","p":["Circa 40 m², spirito loft con vista diretta sul castello vicino, balcone privato, doccia a filo pavimento, letto king size 180 × 200 cm."]},{"h":"In tutte le camere","ul":["Climatizzazione reversibile","Televisione con Netflix","Prese USB-C e USB","Macchina a capsule, bollitore e selezione di tè","Asciugacapelli, asciugamani forniti","Pulizia quotidiana","Attrezzatura per neonati su richiesta: lettino, vaschetta, seggiolone, fasciatoio"]},{"note":"L’acqua calda arriva da un boiler: niente da regolare, è tutto pronto."}]},{"id":"repas","ico":"🥐","t":"Colazione e delizie","hint":"8 – 10, inclusa","lead":"La colazione è inclusa nel soggiorno.","b":[{"ul":["Servita in cucina, dalle 8:00 alle 10:00","Tagliere di degustazione di prodotti locali: 40 €, a pranzo o per l’aperitivo, su prenotazione il giorno prima","Diete particolari (vegetariana, senza glutine, allergie): ditecelo e ci adattiamo"]},{"note":"Nessun’altra ristorazione in casa, ma un ottimo indirizzo a 300 m a piedi — vedi «Nei dintorni»."}]},{"id":"regles","ico":"🌸","t":"La casa","hint":"Piscina 8 – 20 · quiete dalle 21","lead":"Qualche punto di riferimento perché tutti passino un bel soggiorno.","b":[{"h":"Piscina e jacuzzi — dalle 8 alle 20","ul":["Piscina non riscaldata, profondità 1,50 m","La jacuzzi si privatizza camera per camera: chiedete il vostro turno","Non correre a bordo piscina, niente tuffi, niente vetro nelle vicinanze","I bambini sempre accompagnati da un adulto","Teli piscina forniti"],"note":"La piscina può chiudere temporaneamente per motivi di sicurezza, meteo o manutenzione."},{"h":"Sala fitness","p":["Climatizzata, accesso libero dalle 8 alle 20."]},{"h":"Le abitudini","ul":["Quiete gradita dalle 21 — i vicini e le cicale ringraziano","Casa non fumatori: uno spazio fumatori vi aspetta all’esterno","Animali non ammessi","Barbecue non consentito","Pasti in camera: benvenuti","I vostri ospiti sono benvenuti di giorno — basta una parola ai padroni di casa"]}]},{"id":"securite","ico":"🆘","t":"Sicurezza e salute","hint":"Emergenze: 112","lead":"I numeri e i riflessi utili — sperando che non vi servano mai.","b":[{"h":"Numeri di emergenza","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: emergenze europee · 15: SAMU · 18: vigili del fuoco · 114: via SMS (non udenti)","In caso di evacuazione, punto di raccolta: l’ingresso della proprietà"]},{"h":"Salute a due passi","ul":["Studio medico du Peyron (600 m): +33 4 93 24 94 88","Farmacia du Peyron (600 m): +33 4 93 24 90 14 · farmacia di turno: 3237","Pronto soccorso 24 h: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Emergenze pediatriche: CHU-Lenval, Nizza — chiamate prima il 15","Veterinario des Baous (1 km): +33 4 93 59 30 72"]},{"h":"L’estate in Costa Azzurra","ul":["Rischio di incendi boschivi: l’accesso ai rilievi può essere regolamentato, informatevi prima di un’escursione","Ondate di calore: portate acqua ed evitate sforzi nelle ore più calde","Bagni in fiume: prudenza, la portata può salire rapidamente"]}]},{"id":"depart","ico":"👋","t":" et, mit Blick auf den Baou.","it":"Bistronomia sotto il pergolato nel vecchio Saint-Jeannet, vista sul Baou."}},{"n":"Le Sainte-Barbe","c":"restos","min":6,"km":1.5,"q":"Le Sainte-Barbe, Saint-Jeannet","tel":"+33493249438","d":{"fr":"Terrasse panoramique sur la place du village de Saint-Jeannet, jusqu’à la mer par temps clair.","en":"Panoramic terrace on Saint-Jeannet’s village square — you can see the sea on clear days.","es":"Terraza panorámica en la plaza del pueblo de Saint-Jeannet, con el mar al fondo en días claros.","de":"Panoramaterrasse am Dorfplatz von Saint-Jeannet – bei klarem Wetter bis zum Meer.","it":"Terrazza panoramica sulla piazza di Saint-Jeannet, fino al mare nelle giornate limpide."}},{"n":"L’Évidence","c":"restos","min":3,"km":1.0,"q":"L'Évidence restaurant, route de Gattières, Saint-Jeannet","tel":"+33493329265","web":"https://levidence-restaurant.fr/","d":{"fr":"Cuisine soignée au quartier du Peyron, à deux minutes de la maison.","en":"Carefully crafted cooking in the Peyron quarter, two minutes from the house.","es":"Cocina cuidada en el barrio del Peyron, a dos minutos de la casa.","de":"Gepflegte Küche im Viertel Peyron, zwei Minuten vom Haus.","it":"Cucina curata nel quartiere del Peyron, a due minuti dalla casa."}},{"n":"Au Vieuch Pizza","c":"restos","min":18,"km":8.5,"q":"Au Vieuch Pizza, rue Desjobert, Saint-Laurent-du-Var","tel":"+33624265981","d":{"fr":"Pizzas artisanales à pâte longue fermentation, dans le vieux village de Saint-Laurent-du-Var.","en":"Artisan pizzas with slow-fermented dough, in the old village of Saint-Laurent-du-Var.","es":"Pizzas artesanales de masa de larga fermentación, en el casco viejo de Saint-Laurent-du-Var.","de":"Handwerkliche Pizza mit lang fermentiertem Teig, im alten Ortskern von Saint-Laurent-du-Var.","it":"Pizze artigianali a lunga lievitazione, nel borgo vecchio di Saint-Laurent-du-Var."}},{"n":"Le Bateau Ivre","c":"restos","min":22,"km":11.0,"q":"Le Bateau Ivre, quai de la Pérouse, Saint-Laurent-du Paul. Aperto tutti i giorni."}},{"n":"Tourrettes-sur-Loup","c":"patrimoine","min":22,"km":13.0,"q":"Tourrettes-sur-Loup","d":{"fr":"La cité des violettes : village médiéval intact et ateliers d’artisans d’art.","en":"The city of violets: an intact medieval village full of craft workshops.","es":"La ciudad de las violetas: pueblo medieval intacto y talleres de artesanía.","de":"Die Stadt der Veilchen: intaktes mittelalterliches Dorf voller Kunsthandwerker.","it":"La città delle violette: borgo medievale intatto e botteghe artigiane."}},{"n":"Haut-de-Cagnes & musée Renoir","c":"patrimoine","min":22,"km":12.0,"q":"Haut-de-Cagnes, Cagnes-sur-Mer","tel":"+33493206107","d":{"fr":"Le vieux Cagnes autour du château Grimaldi, et la maison-atelier de Renoir aux Collettes (fermé le mardi).","en":"Old Cagnes around the Grimaldi castle, and Renoir’s home and studio at Les Collettes (closed Tuesdays).","es":"El viejo Cagnes en torno al castillo Grimaldi y la casa-taller de Renoir en Les Collettes (cierra los martes).","de":"Das alte Cagnes rund um das Schloss Grimaldi und Renoirs Wohnhaus-Atelier in Les Collettes (dienstags geschlossen).","it":"La vecchia Cagnes attorno al castello Grimaldi e la casa-atelier di Renoir alle Collettes (chiuso il martedì)."}},{"n":"Nice","c":"patrimoine","min":35,"km":19.0,"q":"Vieux Nice","d":{"fr":"Promenade des Anglais, Vieux-Nice, cours Saleya : la capitale de la Côte à une demi-heure.","en":"Promenade des Anglais, Old Nice, Cours Saleya: the Riviera’s capital half an hour away.","es":"Promenade des Anglais, el Niza viejo, Cours Saleya: la capital de la Costa a media hora.","de":"Promenade des Anglais, Altstadt, Cours Saleya: die Hauptstadt der Riviera, eine halbe Stunde entfernt.","it":"Promenade des Anglais, Nizza vecchia, cours Saleya: la capitale della Costa a mezz’ora."}},{"n":"Grasse","c":"patrimoine","min":45,"km":30.0,"q":"Grasse centre historique","d":{"fr":"Capitale mondiale du parfum : visites gratuites chez Fragonard, Molinard et Galimard, musée du parfum.","en":"The world capital of perfume: free tours at Fragonard, Molinard and Galimard, plus the perfume museum.","es":"Capital mundial del perfume: visitas gratuitas en Fragonard, Molinard y Galimard, y museo del perfume.","de":"Welthauptstadt des Parfums: kostenlose Besichtigungen bei Fragonard, Molinard und Galimard, dazu das Parfummuseum.","it":"Capitale mondiale del profumo: visite gratuite da Fragonard, Molinard e Galimard, e museo del profumo."}},{"n":"Baou de Saint-Jeannet","c":"nature","min":6,"km":2.5,"q":"Baou de Saint-Jeannet départ randonnée","d":{"fr":"LA randonnée d’ici : 2 h 30 aller-retour depuis le village, panorama de la mer aux Alpes. Partez tôt l’été.","en":"THE local hike: 2.5 hours round trip from the village, with views from the sea to the Alps. Start early in summer.","es":"LA excursión de aquí: 2 h 30 ida y vuelta desde el pueblo, panorama del mar a los Alpes. Salgan temprano en verano.","de":"DIE Wanderung hier: 2,5 Stunden hin und zurück ab dem Dorf, Panorama vom Meer bis zu den Alpen. Im Sommer früh starten.","it":"LA camminata di qui: 2 h 30 andata e ritorno dal paese, panorama dal mare alle Alpi. D’estate partite presto."}},{"n":"Baou de la Gaude","c":"nature","min":6,"km":2.5,"q":"Baou de la Gaude randonnée","d":{"fr":"Le jumeau plus secret du Baou de Saint-Jeannet ; en boucle par les deux sommets, comptez 4 h.","en":"The quieter twin of the Baou de Saint-Jeannet; allow 4 hours for the loop over both summits.","es":"El gemelo más tranquilo del Baou de Saint-Jeannet; el circuito por ambas cimas lleva unas 4 h.","de":"Der ruhigere Zwilling des Baou de Saint-Jeannet; für die Runde über beide Gipfel 4 Stunden einplanen.","it":"Il gemello più tranquillo del Baou de Saint-Jeannet; per l’anello sulle due cime contate 4 ore."}},{"n":"Gorges du Loup","c":"nature","min":28,"km":17.0,"q":"Gorges du Loup, Pont-du-Loup","d":{"fr":"Cascades et vasques émeraude ; à Pont-du-Loup, la confiserie Florian se visite gratuitement.","en /* Photos : fichiers relatifs dans assets/ — remplacer par les vraies photos
   du lieu (mêmes noms). Si un fichier manque, le bandeau disparaît proprement. */
const PHOTOS = {accueil:'assets/accueil.jpg',bienvenue:'assets/bienvenue.jpg',arrivee:'assets/arrivee.jpg',
  chambres:'assets/chambres.jpg',repas:'assets/repas.jpg',regles:'assets/maison.jpg',
  securite:'assets/securite.jpg',depart:'assets/depart.jpg',autour:'assets/autour.jpg'};

const LANGS = ['fr','en','es','de','it'];
const KEY = 'attrape-reves-lang';
let lang = 'fr';
try {
  const sauve = localStorage.getItem(KEY);
  if (sauve && LANGS.includes(sauve)) lang = sauve;
  else { const nav = (navigator.language || 'fr').slice(0,2).toLowerCase(); if (LANGS.includes(nav)) lang = nav; }
} catch(e) {}

let catActive = 'tous';
let filtre = '';
let places = DATA.places.slice();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const telHref = t => 'tel:' + t;
const mapsDir = q => 'https://www.google.com/maps/dir/?api=1&origin=' + DATA.meta.gps[0] + ',' + DATA.meta.gps[1] + '&destination=' + encodeURIComponent(q);
const bandeau = id => PHOTOS[id] ? '<div class="bandeau"><img src="'+PHOTOS[id]+'" alt="'+esc(DATA.ui[lang].photoAlt)+'" loading="lazy" onerror="this.parentNode.remove()"></div>' : '';

function pageCourante(){
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return null;
  if (h === 'autour') return 'autour';
  return (DATA.sections.fr.some(s => s.id === h)) ? h : null;
}

/* ---------- rendus ---------- */
function rLangs(){
  $('#langs').innerHTML = LANGS.map(l =>
    '<button type="button" data-l="'+l+'" aria-pressed="'+(l===lang)+'">'+l.toUpperCase()+'</button>').join('');
}
function blocs(s){
  let corps = '';
  (s.b || []).forEach(b => {
    if (b.h) corps += '<h3>'+esc(b.h)+'</h3>';
    (b.p || []).forEach(p => corps += '<p>'+esc(p)+'</p>');
    if (b.ul) corps += '<ul>'+b.ul.map(li => '<li>'+esc(li)+'</li>').join('')+'</ul>';
    if (b.note) corps += '<div class="note">'+esc(b.note)+'</div>';
  });
  return corps;
}
function vueAccueil(){
  const ui = DATA.ui[lang];
  const secs = DATA.sections[lang] || DATA.sections.fr;
  const bienv = secs[0];
  let h = '<div class="hero"><span class="surtitre">'+esc(ui.tagline)+' <em>/</em> La Gaude</span>'+
    '<h1 class="grand">'+esc(bienv.t)+'</h1><div class="adr">359 chemin de Provence · 06610 La Gaude</div></div>';
  h += bandeau('accueil');
  h += '<div class="facts">'+ui.facts.map(f => '<div class="fact"><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>').join('')+'</div>';
  h += '<div class="wifi"><h2>📶 '+esc(ui.wifiTitle)+'</h2>'+
    '<div class="lig"><b>'+esc(ui.wifiNet)+'</b><span class="val">'+esc(DATA.meta.wifiSsid)+'</span></div>'+
    '<div class="lig"><b>'+esc(ui.wifiPass)+'</b><span class="val">'+esc(DATA.meta.wifiMdp)+'</span></div>'+
    '<button id="w-copy" type="button">'+esc(ui.copy)+'</button></div>';
  h += '<nav class="menu"><span class="surtitre">'+esc(ui.menuTitle)+'</span>';
  h += secs.map(s => '<a class="carte-nav" href="#/'+s.id+'"><span class="ico">'+s.ico+'</span>'+
    '<span class="tt"><h2>'+esc(s.t)+'</h2>'+(s.hint?'<span class="hint">'+esc(s.hint)+'</span>':'')+'</span>'+
    '<span class="chev">›</span></a>').join('');
  h += '<a class="carte-nav" href="#/autour"><span class="ico">🧭</span><span class="tt"><h2>'+esc(ui.aroundTitle)+'</h2>'+
    '<span class="hint">'+places.length+' ★</span></span><span class="chev">›</span></a>';
  h += '</nav>';
  return h;
}
function vueSection(id){
  const ui = DATA.ui[lang];
  const secs = DATA.sections[lang] || DATA.sections.fr;
  const s = secs.find(x => x.id === id);
  let h = '<div class="retour"><button type="button" id="btn-retour">← '+esc(ui.back)+'</button></div>';
  h += '<div class="page-tete"><span class="surtitre">L’Attrape-Rêves <em>/</em> '+esc(s.hint || '')+'</span>'+
    '<h1 class="grand">'+s.ico+' '+esc(s.t)+'</h1>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+'</div>';
  h += bandeau(id);
  h += '<div class="corps">'+blocs(s)+'</div>';
  return h;
}
function carteLieu(p){
  const ui = DATA.ui[lang];
  let dist = '';
  if (p.walk) dist = p.walk+' '+ui.minShort+' '+ui.onFoot;
  else if (p.min) dist = p.min+' '+ui.minShort+' '+ui.byCar+(p.km?' · '+String(p.km).replace('.',',')+' km':'');
  let act = '';
  if (p.q)   act += '<a class="prim" href="'+mapsDir(p.q)+'">🧭 '+esc(ui.route)+'</a>';
  if (p.tel) act += '<a class="sec" href="'+telHref(p.tel)+'">📞 '+esc(ui.call)+'</a>';
  if (p.web) act += '<a class="sec" href="'+esc(p.web)+'">🌐 '+esc(ui.web)+'</a>';
  return '<article class="lieu"><div class="lt"><h3>'+esc(p.n)+'</h3>'+(dist?'<span class="dist">'+esc(dist)+'</span>':'')+'</div>'+
    '<p>'+esc(p.d[lang]||p.d.fr||'')+'</p>'+(act?'<div class="actions">'+act+'</div>':'')+'</article>';
}
function listeLieux(){
  const ui = DATA.ui[lang];
  const f = filtre.trim().toLowerCase();
  const vis = places.filter(p =>
    (catActive==='tous' || p.c===catActive) &&
    (!f || p.n.toLowerCase().includes(f) || ((p.d[lang]||p.d.fr||'').toLowerCase().includes(f))));
  return vis.length ? vis.map(carteLieu).join('') : '<div class="vide">'+esc(ui.noResult)+'</div>';
}
function vueAutour(){
  const ui = DATA.ui[lang];
  let h = '<div class="retour"><button type="button" id="btn-retour">← '+esc(ui.back)+'</button></div>';
  h += '<div class="page-tete"><span class="surtitre">L’Attrape-Rêves <em>/</em> '+esc(ui.menuTitle)+'</span>'+
    '<h1 class="grand">🧭 '+esc(ui.aroundTitle)+'</h1><p class="lead">'+esc(ui.aroundLead)+'</p></div>';
  h += bandeau('autour');
  h += '<div class="chips" id="chips"><button type="button" data-c="tous" aria-pressed="'+(catActive==='tous')+'">'+esc(ui.allCats)+'</button>'+
    DATA.cats.map(c => '<button type="button" data-c="'+c.id+'" aria-pressed="'+(catActive===c.id)+'">'+c.ico+' '+esc(c.l[lang]||c.l.fr)+'</button>').join('')+'</div>';
  h += '<input class="cherche" id="cherche" type="search" placeholder="'+esc(ui.searchPh)+'" value="'+esc(filtre)+'">';
  h += '<div id="lieux">'+listeLieux()+'</div>';
  h += '<p class="approx">'+esc(ui.approx)+'</p>';
  return h;
}
function rFooter(){
  const ui = DATA.ui[lang];
  $('#f-titre').textContent = ui.contactTitle; $('#f-lead').textContent = ui.contactLead;
  $('#f-tel').href = telHref(DATA.meta.tel); $('#f-tel').textContent = '📞 ' + DATA.meta.telAff;
  $('#f-mail').href = 'mailto:' + DATA.meta.email; $('#f-mail').textContent = '✉️ ' + ui.writeUs;
  $('#f-maps').href = 'https://www.google.com/maps/search/?api=1&query=' + DATA.meta.gps[0] + ',' + DATA.meta.gps[1];
  $('#f-maps').textContent = '📍 ' + ui.openMaps;
  $('#f-avis').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent("L'Attrape-Rêves " + DATA.meta.adresse);
  $('#f-avis').textContent = '⭐ ' + ui.review;
}
function rendre(){
  document.documentElement.lang = lang;
  rLangs(); rFooter();
  const p = pageCourante();
  $('#vue').innerHTML = p === 'autour' ? vueAutour() : (p ? vueSection(p) : vueAccueil());
  window.scrollTo(0, 0);
}

/* ---------- événements ---------- */
window.addEventListener('hashchange', rendre);
document.addEventListener('click', ev => {
  const lb = ev.target.closest('#langs button');
  if (lb) { lang = lb.dataset.l; try { localStorage.setItem(KEY, lang); } catch(e){}; rendre(); return; }
  const cb = ev.target.closest('#chips button');
  if (cb) { catActive = cb.dataset.c;
    document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === catActive));
    $('#lieux').innerHTML = listeLieux(); return; }
  if (ev.target.id === 'btn-retour') {
    if (history.length > 1) history.back(); else location.hash = '';
    return;
  }
  if (ev.target.id === 'w-copy') {
    const ui = DATA.ui[lang];
    const fin = ok => { const b = $('#w-copy'); if (!b) return;
      b.textContent = ok ? ui.copied : ui.copy; setTimeout(() => { const b2 = $('#w-copy'); if (b2) b2.textContent = ui.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(DATA.meta.wifiMdp).then(() => fin(true), () => fin(false));
    else fin(false);
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'cherche') { filtre = ev.target.value; $('#lieux').innerHTML = listeLieux(); }
});

/* Chargement distant (phase WordPress uniquement) — repli embarqué sinon.
   Validation stricte : rejet total si plus de 10 % d'enregistrements malformés.
   Fusion PAR NOM, jamais par index. Aucune erreur n'est montrée au voyageur. */
function valide(p){
  return p && typeof p.n==='string' && p.n.trim() && typeof p.c==='string' &&
         p.d && typeof p.d==='object' && typeof (p.d.fr||p.d.en)==='string';
}
if (API_BASE) {
  const controle = new AbortController();
  const chrono = setTimeout(() => controle.abort(), 4000);
  fetch(API_BASE + 'lieux', { signal: controle.signal, cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(arr => {
      clearTimeout(chrono);
      if (!Array.isArray(arr) || !arr.length) return;
      const ok = arr.filter(valide);
      if (ok.length < arr.length * 0.9) return;          // >10 % malformés → repli
      const parNom = new Map(ok.map(p => [p.n, p]));
      places = DATA.places.map(p => parNom.get(p.n) || p);
      ok.forEach(p => { if (!DATA.places.some(e => e.n === p.n)) places.push(p); });
      if (pageCourante() === 'autour') rendre();
    })
    .catch(() => {});                                     // silence : le repli suffit
}

rendre();
</script>
