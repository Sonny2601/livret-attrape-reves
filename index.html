:root{
  --fond:#FAEFE6; --carte:#FFFDF8; --encre:#44495D; --accent:#5C6279;
  --accent-clair:#B8BFD0; --sauge:#89A189; --rayon:20px;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--fond);color:var(--encre);font-family:var(--sans);line-height:1.6;font-size:16px}
a{color:var(--accent)}
img{display:block}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
/* ---------- entête ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(250,239,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(92,98,121,.14)}
.head-in{max-width:680px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:.02em;color:var(--accent);text-decoration:none;line-height:1.1;display:flex;align-items:center;gap:9px}
.brand img{height:42px;width:auto;flex:none}
.langs{display:flex;gap:2px}
.langs button{min-width:42px;min-height:44px;border:none;background:transparent;border-radius:12px;font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--accent);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--fond)}
/* ---------- motifs typographiques du site ---------- */
.surtitre{font-family:var(--sans);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--sauge)}
.surtitre em{font-style:normal;color:var(--accent-clair)}
h1.grand,h2.grand{font-family:var(--serif);font-weight:600;color:var(--accent);line-height:1.12}
/* ---------- bandeaux photo ---------- */
.bandeau{border-radius:var(--rayon);overflow:hidden;box-shadow:0 8px 26px rgba(92,98,121,.16);margin:16px 0}
.bandeau img{width:100%;aspect-ratio:15/8;object-fit:cover}
/* ---------- accueil ---------- */
.hero{padding:26px 0 4px;text-align:center}
.hero h1{font-size:2.4rem}
.hero .adr{margin-top:4px;font-size:.9rem;opacity:.8}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.fact{background:var(--carte);border:1px solid rgba(92,98,121,.14);border-radius:14px;padding:8px 14px;box-shadow:0 2px 8px rgba(92,98,121,.07)}
.fact b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sauge);font-weight:700}
.fact span{font-size:.95rem;font-weight:600}
.wifi{background:var(--accent);color:var(--fond);border-radius:var(--rayon);padding:18px;margin:18px 0;box-shadow:0 8px 22px rgba(92,98,121,.28)}
.wifi h2{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.wifi .lig{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(250,239,230,.25)}
.wifi .lig b{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700}
.wifi .val{font-size:1.05rem;font-weight:600;user-select:all;text-align:right}
.wifi .btns{display:flex;gap:8px;margin-top:12px}
.wifi .btns button{flex:1;min-height:46px;border:none;border-radius:13px;background:var(--fond);color:var(--accent);font-weight:700;font-size:.85rem;padding:0 8px;cursor:pointer;font-family:var(--sans)}
.wifi .btns button.ghost{background:rgba(250,239,230,.16);color:var(--fond)}
.wqr{display:none;background:#fff;border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.wqr.on{display:block}
.wqr svg{width:190px;max-width:72%;height:auto}
.wqr p{color:#44495D;font-size:.82rem;margin-top:8px}
.rentrer{background:var(--carte);border:1px solid rgba(92,98,121,.12);border-radius:var(--rayon);box-shadow:0 3px 12px rgba(92,98,121,.07);padding:18px;margin:18px 0}
.rentrer h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.55rem;color:var(--accent)}
.rentrer>p{font-size:.9rem;margin:6px 0 4px}
.rentrer .adl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--sauge);margin-top:10px}
.rentrer .adv{font-size:.95rem;margin:2px 0 12px}
.navgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.navgrid{grid-template-columns:repeat(4,1fr)}}
.navgrid a{min-height:46px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(92,98,121,.16);border-radius:12px;color:var(--encre);font-weight:600;font-size:.87rem;text-decoration:none;box-shadow:0 1px 4px rgba(92,98,121,.06)}
details.nav{flex:1 1 100%}
details.nav summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--fond);border-radius:13px;font-size:.86rem;font-weight:700;padding:0 12px}
details.nav summary::-webkit-details-marker{display:none}
details.nav .lbl{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sauge);margin:10px 0 6px}
#haut{position:fixed;right:14px;bottom:18px;z-index:20;width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:var(--fond);font-size:1.3rem;box-shadow:0 6px 18px rgba(68,73,93,.35);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
#haut.on{opacity:1;pointer-events:auto}
.menu{margin:26px 0 8px}
.menu .surtitre{text-align:center;display:block;margin-bottom:12px}
.carte-nav{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid rgba(92,98,121,.12);border-radius:var(--rayon);box-shadow:0 3px 12px rgba(92,98,121,.07);padding:16px;margin-bottom:10px;text-decoration:none;min-height:64px}
.carte-nav .ico{font-size:1.5rem;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(184,191,208,.18);border-radius:14px}
.carte-nav .tt{flex:1}
.carte-nav h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--accent);line-height:1.15}
.carte-nav .hint{font-size:.82rem;color:var(--encre);opacity:.72}
.carte-nav .chev{flex:none;color:var(--accent-clair);font-size:1.4rem}
/* ---------- pages ---------- */
.retour{position:sticky;top:64px;z-index:9;padding:10px 0}
.retour button{min-height:44px;border:1px solid rgba(92,98,121,.18);background:var(--carte);color:var(--accent);border-radius:22px;padding:0 18px;font-size:.88rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(92,98,121,.10)}
.page-tete{margin:6px 0 2px}
.page-tete h1{font-size:2rem;margin-top:2px}
.page-tete .lead{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--accent);margin-top:8px}
.corps h3{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:var(--accent);margin:18px 0 4px}
.corps p{margin:8px 0}
.corps ul{margin:6px 0;list-style:none}
.corps ul li{padding:6px 0 6px 24px;position:relative}
.corps ul li::before{content:"•";position:absolute;left:8px;color:var(--sauge);font-weight:700}
.corps .note{margin:14px 0;font-size:.9rem;background:rgba(184,191,208,.18);border-radius:14px;padding:12px 14px}
/* ---------- autour ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;min-height:44px;border:1px solid rgba(92,98,121,.2);background:var(--carte);border-radius:22px;padding:0 15px;font-size:.86rem;font-weight:600;color:var(--encre);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--fond)}

nd a fourth, Provence, coming soon.","b":[{"h":"La Suite — 2nd floor","p":["About 50 m², separate bedroom, lounge and fully equipped kitchen. 160 × 200 cm bed, private 25 m² rooftop terrace overlooking the castle and the Baou de Saint-Jeannet."]},{"h":"Baou room — 1st floor","p":["About 45 m², leafy “Jungle” atmosphere, working fireplace (ask us for wood), private balcony, 180 × 200 cm king-size bed."]},{"h":"Château room — 1st floor","p":["About 40 m², loft spirit with a direct view of the neighbouring castle, private balcony, walk-in shower, 180 × 200 cm king-size bed."]},{"h":"In every room","ul":["Reversible air conditioning","TV with Netflix","USB-C and USB sockets","Capsule coffee machine, kettle and a selection of teas","Hairdryer, towels provided","Daily housekeeping","Baby equipment on request: travel cot, baby bath, high chair, changing mat"]},{"note":"Hot water comes from a tank: nothing to adjust, everything is ready."}]},{"id":"repas","ico":"🥐","t":"Breakfast & treats","hint":"8 – 10 am, included","lead":"Breakfast is included in your stay.","b":[{"ul":["Served in the kitchen, from 8:00 to 10:00 am","Local produce tasting board: €40, at lunchtime or as an aperitif, book the day before","Special diets (vegetarian, gluten-free, allergies): tell us and we will adapt"]},{"note":"No other meals on site, but an excellent address 300 m away on foot — see “Around us”."}]},{"id":"regles","ico":"🌸","t":"The Auberge","hint":"Pool & hot tub 8 am – 8 pm","lead":"A few pointers so everyone has a lovely stay.","b":[{"h":"Pool & hot tub — 8 am to 8 pm","ul":["Unheated pool, 1.50 m deep","The hot tub is privatised room by room: ask for your slot","No running around the pool, no diving, no glass nearby","Children must always be accompanied by an adult","Pool towels provided"],"note":"The pool may close temporarily for safety, weather or maintenance reasons."},{"h":"Fitness room","p":["Air-conditioned, free access from 8 am to 8 pm."]},{"h":"Good to know","ul":["Meals in ry with technical conditions, the weather or the provider."]}]},{"id":"securite","ico":"🆘","t":"Safety & health","hint":"Emergencies: 112","lead":"Useful numbers and reflexes — hoping you will never need them.","b":[{"h":"Emergency numbers","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: European emergency number · 15: ambulance (SAMU) · 18: fire brigade · 114: by SMS (hearing-impaired)","In case of evacuation, assembly point: the entrance of the property"]},{"h":"Health nearby","ul":["Peyron medical practice (600 m): +33 4 93 24 94 88","Peyron pharmacy (600 m): +33 4 93 24 90 14 · duty pharmacy: 3237","24/7 emergency room: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Children’s emergencies: CHU-Lenval, Nice — call 15 first","Baous veterinary clinic (1 km): +33 4 93 59 30 72"]},{"h":"Summer on the Riviera","ul":["Forest fire risk: access to the hills may be restricted, check before hiking","Heat waves: carry water, avoid effort in the hottest hours","River swimming: be careful, water levels can rise quickly"]}]},{"id":"depart","ico":"👋","t":"Departure day","hint":"Before 11 am","lead":"Vacate the room between 8:30 and 11 am — and leave with a light heart.","b":[{"ul":["Tell us your approximate departure time","Windows closed, air conditioning off","Hand us the keys, or drop them in the key box","The bins? We take care of them","Nothing else: you are our guests until the very last minute"]},{"note":"A review of your stay helps us enormously — the link is at the bottom of the page. Thank you!"}]}],"es":[{"id":"bienvenue","ico":"🌿","t":"Bienvenidos","hint":"Julien & Stéphanie","lead":"Nos complace recibirles en nuestro remanso de paz, donde cada detalle está pensado para que su estancia sea tan agradable como memorable.","b":[{"p":["Situada al pie del pueblo encaramado de Saint-Jeannet, en el interior de Niza, nuestra Auberge invita al descanso y al descubrimiento. Cerca de Niza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer y Grasse, disfrutarán de un entorno preservado entre mar y montaña.","Bienvenidos a nuestro sueño. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"Llegada y salida","hint":"15 – 19 h · 8:30 – 11 h","lead":"Dos horarios que recordar y un mensaje que nos ayuda mucho.","b":[{"ul":["Llegada de 15:00 a 19:00","Salida de 8:30 a 11:00","Aparcamiento privado: 3 plazas en la propiedad"]},{"h":"Las llaves","p":["Les recibimos en persona; según su hora de llegada, las llaves pueden esperarles en la caja de llaves. Sin códigos que recordar: si lo necesitan, llámennos al +33 6 72 87 16 97."]},{"h":"Avísennos","p":["Una palabra sobre su hora aproximada de llegada nos ayuda mucho. Una llegada más tardía es posible en caso de imprevisto: avísennos lo antes posible."]}]},{"id":"chambres","ico":"🛏️","t":"Las habitaciones","hint":"La Suite · Baou · Château","lead":"Tres habitaciones, cada una con su carácter — y una cuarta, Provence, próximamente.","b":[{"h":"La Suite — 2.ª planta","p":["Unos 50 m², dormitorio independiente, salón y cocina totalmente equipada. Cama de 160 × 200 cm, terraza privada de 25 m² con vistas al castillo y al Baou de Saint-Jeannet."]},{"h":"Habitación Baou — 1.ª planta","p":["Unos 45 m², ambiente vegetal «Jungle», chimenea funcional (pídannos leña), balcón privado, cama king size de 180 × 200 cm."]},{"h":"Habitación Château — 1.ª planta","p":["Unos 40 m², espíritu loft con vista directa al castillo vecino, balcón privado, ducha a ras de suelo, cama king size de 180 × 200 cm."]},{"h":"En todas las habitaciones","ul":["Aire acondicionado reversible","Televisión con Netflix","Enchufes USB-C y USB","Cafetera de cápsulas, hervidor y selección de tés","Secador de pelo, toallas incluidas","Limpieza diaria","Equipamiento para bebés bajo petición: cuna de viaje, bañera, trona, cambiador"]},{"note":"El agua caliente proviene de un termo: nada que ajustar, todo está listo."}]},{"id":"repas","ico":"🥐","t":"Desayuno y caprichos","hint":"8 – 10 h, incluido","lead":"El desayuno está incluido en su estancia.","b":[{"ul":["Servido en la cocina, de 8:00 a 10:00","Tabla de degustación de productos locales: 40 €, al mediodía o como aperitivo, reservando la víspera","Dietas especiales (vegetariana, sin gluten, alergias): dígannoslo y nos adaptamos"]},{"note":"No hay otra restauración en la casa, pero sí una excelente dirección a 300 m a pie — vean «Qué ver cerca»."}]},{"id":"regles","ico":"🌸","t":"La Auberge","hint":"Piscina y jacuzzi 8 – 20 h","lead":"Algunas pautas para que todos disfruten de una bonita estancia.","b":[{"h":"Piscina y jacuzzi — de 8 a 20 h","ul":["Piscina sin climatizar, 1,50 m de profundidad","El jacuzzi se privatiza habitación por habitación: pidan su turno","No correr alrededor de la piscina, no tirarse de cabeza, nada de vidrio cerca","Los niños siempre acompañados por un adulto","Toallas de piscina incluidas"],"note":"La piscina puede cerrar temporalmente por seguridad, meteorología o mantenimiento."},{"h":"Gimnasio","p":["Climatizado, de libre acceso de 8 a 20 h."]},{"h":"Conviene saber","ul":["Comidas en la habitación: bienvenidas","Barbacoa no permitida, ni dentro ni fuera"]}]},{"id":"vie","ico":"🕊️","t":"Reglas de convivencia","hint":"Silencio 22 h – 8 h","lead":"Algunas pautas sencillas para que el lugar siga siendo lo que es.","b":[{"h":"Tranquilidad","p":["La Auberge es un lugar de tranquilidad. Les rogamos respetar el descanso de los demás huéspedes, de las personas que viven aquí y del vecindario, en particular entre las 22:00 y las 8:00."]},{"h":"Acceso a la Auberge","ul":["Habitaciones, espacios comunes, exteriores y aparcamiento están reservados a los clientes alojados","Las visitas externas solo se reciben con nuestro acuerdo previo","El número de personas debe corresponder a la reserva"]},{"h":"Niños","p":["Bienvenidos, y bajo la responsabilidad permanente de los adultos que los acompañan. Vigilancia especial en los exteriores, las escaleras, las zonas de aparcamiento, cerca de la piscina y de los animales."]},{"h":"Animales","p":["No se admiten las mascotas de los huéspedes. La Auberge ya acoge gatos y perros residentes: les rogamos respetar su presencia, no alimentarlos, no molestarlos, no encerrarlos ni dejarlos entrar en los alojamientos."]},{"h":"No fumadores","ul":["Habitaciones y espacios interiores estrictamente para no fumadores","Hay ceniceros en las zonas exteriores autorizadas","Nunca colillas en el suelo, en los macizos o en las jardineras","Ni velas, incienso, hornillos, barbacoas o braseros en las habitaciones"]},{"h":"Sobriedad","p":["Les rogamos separar los residuos, evitar el derroche de agua, apagar las luces innecesarias, cerrar los grifos y usar con moderación la calefacción y el aire acondicionado. Aquí la sobriedad no es una restricción austera: es una manera de dejar respirar el lugar."]},{"h":"Aparcamiento","p":["Únicamente en las zonas previstas, sin obstaculizar los accesos y los pasos. Circulación a paso de peatón dentro de la Auberge."]},{"h":"Objetos personales","p":["Equipajes, objetos de valor, vehículos y equipos quedan bajo la responsabilidad de sus propietarios. La Auberge no se hace responsable de pérdidas, robos o daños, salvo falta probada por su parte."]},{"h":"Wi-Fi","p":["Uso legal y razonable. La velocidad puede variar según las condiciones técnicas, la meteorología o el operador."]}]},{"id":"securite","ico":"🆘","t":"Seguridad y salud","hint":"Emergencias: 112","lead":"Los números y reflejos útiles — esperando que nunca los necesiten.","b":[{"h":"Números de emergencia","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: emergencias europeas · 15: SAMU · 18: bomberos · 114: por SMS (personas sordas)","En caso de evacuación, punto de encuentro: la entrada de la propiedad"]},{"h":"Salud muy cerca","ul":["Consultorio médico du Peyron (600 m): +33 4 93 24 94 88","Farmacia du Peyron (600 m): +33 4 93 24 90 14 · farmacia de guardia: 3237","Urgencias 24 h: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Urgencias infantiles: CHU-Lenval, Niza — llamen primero al 15","Veterinario des Baous (1 km): +33 4 93 59 30 72"]},{"h":"El verano en la Costa Azul","ul":["Riesgo de incendios forestales: el acceso a los montes puede estar regulado, infórmense antes de una excursión","Olas de calor: lleven agua y eviten el esfuerzo en las horas más calurosas","Baño en río: prudencia, el caudal puede subir rápidamente"]}]},{"id":"depart","ico":"👋","t":"El día de la salida","hint":"Antes de las 11 h","lead":"Dejen la habitación entre las 8:30 y las 11 h — y márchense con el corazón ligero.","b":[{"ul":["Dígannos su hora aproximada de salida","Ventanas cerradas, aire acondicionado apagado","Entréguennos las llaves en mano o déjenlas en la caja de llaves","¿La basura? Nos encargamos nosotros","Nada más: son nuestros huéspedes hasta el último minuto"]},{"note":"Una opinión sobre su estancia nos ayuda muchísimo — el enlace está al pie de página. ¡Gracias!"}]}],"de":[{"id":"bienvenue","ico":"🌿","t":"Willkommen","hint":"Julien & Stéphanie","lead":"Wir freuen uns, Sie in unserer Oase der Ruhe zu empfangen, in der jedes Detail dazu gedacht ist, Ihren Aufenthalt so angenehm wie unvergesslich zu machen.","b":[{"p":["Am Fuße des Bergdorfs Saint-Jeannet, im Hinterland von Nizza gelegen, lädt unsere Auberge zum Entspannen und Entdecken ein. In der Nähe von Nizza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer und Grasse genießen Sie eine geschützte Umgebung zwischen Meer und Bergen.","Willkommen in unserem Traum. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"An- & Abreise","hint":"15 – 19 Uhr · 8:30 – 11 Uhr","lead":"Zwei Uhrzeiten zum Merken – und eine Nachricht, die uns sehr hilft.","b":[{"ul":["Anreise von 15:00 bis 19:00 Uhr","Abreise von 8:30 bis 11:00 Uhr","Privatparkplatz: 3 Stellplätze auf dem Grundstück"]},{"h":"Die Schlüssel","p":["Wir empfangen Sie persönlich; je nach Ankunftszeit können die Schlüssel im Schlüsselkasten auf Sie warten. Kein Code zu merken: rufen Sie uns bei Bedarf unter +33 6 72 87 16 97 an."]},{"h":"Sagen Sie uns Bescheid","p":["Ein kurzes Wort zu Ihrer ungefähren Ankunftszeit hilft uns sehr. Eine spätere Ankunft ist bei Unvorhergesehenem möglich – geben Sie uns einfach so früh wie möglich Bescheid."]}]},{"id":"chambres","ico":"🛏️","t":"Die Zimmer","hint":"La Suite · Baou · Château","lead":"Drei Zimmer, jedes mit eigenem Charakter – und ein viertes, Provence, folgt bald.","b":[{"h":"La Suite — 2. Etage","p":["Rund 50 m², separates Schlafzimmer, Wohnzimmer und voll ausgestattete Küche. Bett 160 × 200 cm, private 25-m²-Dachterrasse mit Blick auf das Schloss und den Baou von Saint-Jeannet."]},{"h":"Zimmer Baou — 1. Etage","p":["Rund 45 m², grüne „Jungle“-Atmosphäre, funktionierender Kamin (fragen Sie uns nach Holz), privater Balkon, Kingsize-Bett 180 × 200 cm."]},{"h":"Zimmer Château — 1. Etage","p":["Rund 40 m², Loft-Charakter mit direktem Blick auf das benachbarte Schloss, privater Balkon, ebenerdige Dusche, Kingsize-Bett 180 × 200 cm."]},{"h":"In allen Zimmern","ul":["Klimaanlage (heizen & kühlen)","Fernseher mit Netflix","USB-C- und USB-Anschlüsse","Kapselmaschine, Wasserkocher und Teeauswahl","Föhn, Handtücher inklusive","Tägliche Reinigung","Babyausstattung auf Anfrage: Reisebett, Babywanne, Hochstuhl, Wickelauflage"]},{"note":"Das warme Wasser kommt aus einem Boiler: nichts einzustellen, alles ist bereit."}]},{"id":"repas","ico":"🥐","t":"Frühstück & Genuss","hint":"8 – 10 Uhr, inklusive","lead":"Das Frühstück ist im Aufenthalt inbegriffen.","b":[{"ul":["Serviert in der Küche, von 8:00 bis 10:00 Uhr","Verkostungsplatte mit regionalen Produkten: 40 €, mittags oder zum Aperitif, Reservierung am Vortag","Besondere Ernährung (vegetarisch, glutenfrei, Allergien): sagen Sie uns Bescheid, wir passen uns an"]},{"note":"Keine weitere Verpflegung im Haus, aber eine ausgezeichnete Adresse 300 m zu Fuß entfernt – siehe „In der Umgebung“."}]},{"id":"regles","ico":"🌸","t":"Die Auberge","hint":"Pool & Whirlpool 8 – 20 Uhr","lead":"Ein paar Hinweise, damit alle einen schönen Aufenthalt haben.","b":[{"h":"Pool & Whirlpool — 8 bis 20 Uhr","ul":["Unbeheizter Pool, 1,50 m tief","Der Whirlpool wird zimmerweise privatisiert: fragen Sie nach Ihrem Zeitfenster","Nicht am Beckenrand rennen, nicht springen, kein Glas in Beckennähe","Kinder immer in Begleitung eines Erwachsenen","Poolhandtücher werden gestellt"],"note":"Der Pool kann aus Sicherheits-, Wetter- oder Wartungsgründen vorübergehend schließen."},{"h":"Fitnessraum","p":["Klimatisiert, freier Zugang von 8 bis 20 Uhr."]},{"h":"Gut zu wissen","ul":["Mahlzeiten im Zimmer: gern","Grillen nicht gestattet, drinnen wie draußen"]}]},{"id":"vie","ico":"🕊️","t":"Hausregeln","hint":"Ruhe 22 – 8 Uhr","lead":"Ein paar einfache Grundsätze, damit der Ort bleibt, was er ist.","b":[{"h":"Ruhe","p":["Die Auberge ist ein Ort der Ruhe. Bitte respektieren Sie die Erholung der anderen Gäste, der hier lebenden Menschen und der Nachbarschaft, insbesondere zwischen 22:00 und 8:00 Uhr."]},{"h":"Zugang zur Auberge","ul":["Zimmer, Gemeinschaftsräume, Außenbereiche und Parkplätze sind den übernachtenden Gästen vorbehalten","Externe Besucher werden nur mit unserer vorherigen Zustimmung empfangen","Die Personenzahl muss der Buchung entsprechen"]},{"h":"Kinder","p":["Willkommen, und in der ständigen Verantwortung der begleitenden Erwachsenen. Besondere Aufmerksamkeit im Freien, auf den Treppen, auf den Parkflächen, am Pool und bei den Tieren."]},{"h":"Tiere","p":["Haustiere der Gäste sind nicht zugelassen. In der Auberge leben bereits Katzen und Hunde: bitte respektieren Sie ihre Anwesenheit – nicht füttern, nicht stören, nicht einsperren und nicht in die Unterkünfte lassen."]},{"h":"Nichtraucher","ul":["Zimmer und Innenräume sind strikt rauchfrei","Aschenbecher stehen in den erlaubten Außenbereichen bereit","Niemals Kippen auf den Boden, in die Beete oder die Pflanzkübel","Keine Kerzen, kein Räucherwerk, keine Kocher, Grills oder Feuerschalen in den Zimmern"]},{"h":"Maßhalten","p":["Bitte trennen Sie den Müll, vermeiden Sie Wasserverschwendung, schalten Sie unnötiges Licht aus, schließen Sie die Hähne und nutzen Sie Heizung und Klimaanlage mit Maß. Maßhalten ist hier kein strenger Zwang, sondern eine Art, den Ort atmen zu lassen."]},{"h":"Parken","p":["Nur auf den vorgesehenen Flächen, ohne Zufahrten und Durchgänge zu versperren. Schrittgeschwindigkeit auf dem Gelände der Auberge."]},{"h":"Persönliche Gegenstände","p":["Gepäck, Wertsachen, Fahrzeuge und Ausrüstung bleiben in der Verantwortung ihrer Eigentümer. Die Auberge haftet nicht für Verlust, Diebstahl oder Beschädigung, außer bei nachgewiesenem eigenem Verschulden."]},{"h":"WLAN","p":["Legale und vernünftige Nutzung. Die Geschwindigkeit kann je nach technischen Bedingungen, Wetter oder Anbieter schwanken."]}]},{"id":"securite","ico":"🆘","t":"Sicherheit & Gesundheit","hint":"Notruf: 112","lead":"Nützliche Nummern und Hinweise – in der Hoffnung, dass Sie sie nie brauchen.","b":[{"h":"Notrufnummern","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: europäischer Notruf · 15: Rettungsdienst (SAMU) · 18: Feuerwehr · 114: per SMS (hörgeschädigt)","Im Evakuierungsfall Sammelpunkt: die Einfahrt des Grundstücks"]},{"h":"Gesundheit ganz nah","ul":["Arztpraxis du Peyron (600 m): +33 4 93 24 94 88","Apotheke du Peyron (600 m): +33 4 93 24 90 14 · Notdienst-Apotheke: 3237","Notaufnahme rund um die Uhr: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 Min.): +33 4 92 13 53 13","Kindernotfälle: CHU-Lenval, Nizza – rufen Sie zuerst die 15 an","Tierarztpraxis des Baous (1 km): +33 4 93 59 30 72"]},{"h":"Sommer an der Côte d’Azur","ul":["Waldbrandgefahr: der Zugang zu den Bergen kann eingeschränkt sein, informieren Sie sich vor einer Wanderung","Hitzewellen: Wasser mitnehmen, Anstrengung in den heißesten Stunden vermeiden","Baden im Fluss: Vorsicht, der Pegel kann schnell steigen"]}]},{"id":"depart","ico":"👋","t":"Der Abreisetag","hint":"Vor 11 Uhr","lead":"Geben Sie das Zimmer zwischen 8:30 und 11 Uhr frei – und reisen Sie mit leichtem Herzen ab.","b":[{"ul":["Nennen Sie uns Ihre ungefähre Abreisezeit","Fenster geschlossen, Klimaanlage aus","Geben Sie uns die Schlüssel persönlich oder legen Sie sie in den Schlüsselkasten","Der Müll? Darum kümmern wir uns","Sonst nichts: Sie sind bis zur letzten Minute unsere Gäste"]},{"note":"Eine Bewertung Ihres Aufenthalts hilft uns sehr – der Link steht unten auf der Seite. Danke!"}]}],"it":[{"id":"bienvenue","ico":"🌿","t":"Benvenuti","hint":"Julien & Stéphanie","lead":"Siamo felici di accogliervi nel nostro angolo di pace, dove ogni dettaglio è pensato per rendere il vostro soggiorno piacevole e indimenticabile.","b":[{"p":["Ai piedi del borgo arroccato di Saint-Jeannet, nell’entroterra di Nizza, la nostra Auberge invita al relax e alla scoperta. Vicino a Nizza, Vence, Saint-Paul-de-Vence, Cagnes-sur-Mer e Grasse, godrete di un ambiente preservato tra mare e montagna.","Benvenuti nel nostro sogno. — Julien & Stéphanie"]}]},{"id":"arrivee","ico":"🔑","t":"Arrivo e partenza","hint":"15 – 19 · 8:30 – 11","lead":"Due orari da ricordare e un messaggio che ci aiuta molto.","b":[{"ul":["Arrivo dalle 15:00 alle 19:00","Partenza dalle 8:30 alle 11:00","Parcheggio privato: 3 posti nella proprietà"]},{"h":"Le chiavi","p":["Vi accogliamo di persona; a seconda dell’orario di arrivo, le chiavi possono attendervi nella cassetta delle chiavi. Nessun codice da ricordare: in caso di bisogno, chiamateci al +33 6 72 87 16 97."]},{"h":"Avvisateci","p":["Una parola sul vostro orario approssimativo di arrivo ci è di grande aiuto. Un arrivo più tardi resta possibile in caso di imprevisto: avvisateci appena potete."]}]},{"id":"chambres","ico":"🛏️","t":"Le camere","hint":"La Suite · Baou · Château","lead":"Tre camere, ognuna con il suo carattere — e una quarta, Provence, in arrivo.","b":[{"h":"La Suite — 2º piano","p":["Circa 50 m², camera indipendente, salotto e cucina completamente attrezzata. Letto 160 × 200 cm, terrazza privata di 25 m² con vista sul castello e sul Baou di Saint-Jeannet."]},{"h":"Camera Baou — 1º piano","p":["Circa 45 m², atmosfera vegetale «Jungle», camino funzionante (chiedeteci la legna), balcone privato, letto king size 180 × 200 cm."]},{"h":"Camera Château — 1º piano","p":["Circa 40 m², spirito loft con vista diretta sul castello vicino, balcone privato, doccia a filo pavimento, letto king size 180 × 200 cm."]},{"h":"In tutte le camere","ul":["Climatizzazione reversibile","Televisione con Netflix","Prese USB-C e USB","Macchina a capsule, bollitore e selezione di tè","Asciugacapelli, asciugamani forniti","Pulizia quotidiana","Attrezzatura per neonati su richiesta: lettino, vaschetta, seggiolone, fasciatoio"]},{"note":"L’acqua calda arriva da un boiler: niente da regolare, è tutto pronto."}]},{"id":"repas","ico":"🥐","t":"Colazione e delizie","hint":"8 – 10, inclusa","lead":"La colazione è inclusa nel soggiorno.","b":[{"ul":["Servita in cucina, dalle 8:00 alle 10:00","Tagliere di degustazione di prodotti locali: 40 €, a pranzo o per l’aperitivo, su prenotazione il giorno prima","Diete particolari (vegetariana, senza glutine, allergie): ditecelo e ci adattiamo"]},{"note":"Nessun’altra ristorazione in casa, ma un ottimo indirizzo a 300 m a piedi — vedi «Nei dintorni»."}]},{"id":"regles","ico":"🌸","t":"L’Auberge","hint":"Piscina e jacuzzi 8 – 20","lead":"Qualche punto di riferimento perché tutti passino un bel soggiorno.","b":[{"h":"Piscina e jacuzzi — dalle 8 alle 20","ul":["Piscina non riscaldata, profondità 1,50 m","La jacuzzi si privatizza camera per camera: chiedete il vostro turno","Non correre a bordo piscina, niente tuffi, niente vetro nelle vicinanze","I bambini sempre accompagnati da un adulto","Teli piscina forniti"],"note":"La piscina può chiudere temporaneamente per motivi di sicurezza, meteo o manutenzione."},{"h":"Sala fitness","p":["Climatizzata, accesso libero dalle 8 alle 20."]},{"h":"Da sapere","ul":["Pasti in camera: benvenuti","Barbecue non consentito, né dentro né fuori"]}]},{"id":"vie","ico":"🕊️","t":"Regole di convivenza","hint":"Quiete 22 – 8","lead":"Qualche semplice punto di riferimento perché il luogo resti ciò che è.","b":[{"h":"Quiete","p":["L’Auberge è un luogo di tranquillità. Vi preghiamo di rispettare il riposo degli altri ospiti, delle persone che vivono qui e del vicinato, in particolare tra le 22:00 e le 8:00."]},{"h":"Accesso all’Auberge","ul":["Camere, spazi comuni, esterni e parcheggio sono riservati ai clienti alloggiati","I visitatori esterni sono ricevuti solo con il nostro accordo preventivo","Il numero di persone deve corrispondere alla prenotazione"]},{"h":"Bambini","p":["Benvenuti, e sotto la responsabilità permanente degli adulti che li accompagnano. Particolare attenzione negli esterni, sulle scale, nelle zone di parcheggio, a bordo piscina e vicino agli animali."]},{"h":"Animali","p":["Gli animali degli ospiti non sono ammessi. L’Auberge ospita già gatti e cani residenti: vi preghiamo di rispettare la loro presenza, di non nutrirli, disturbarli, rinchiuderli né lasciarli entrare negli alloggi."]},{"h":"Non fumatori","ul":["Camere e spazi interni rigorosamente non fumatori","Posacenere disponibili negli spazi esterni autorizzati","Mai mozziconi a terra, nelle aiuole o nelle fioriere","Niente candele, incensi, fornelli, barbecue o bracieri nelle camere"]},{"h":"Sobrietà","p":["Vi preghiamo di differenziare i rifiuti, evitare gli sprechi d’acqua, spegnere le luci inutili, chiudere i rubinetti e usare con misura riscaldamento e climatizzazione. Qui la sobrietà non è una costrizione austera: è un modo di lasciare respirare il luogo."]},{"h":"Parcheggio","p":["Solo nelle zone previste, senza ostacolare accessi e passaggi. Circolazione a passo d’uomo all’interno dell’Auberge."]},{"h":"Oggetti personali","p":["Bagagli, oggetti di valore, veicoli e attrezzature restano sotto la responsabilità dei proprietari. L’Auberge non può essere ritenuta responsabile di perdite, furti o danni, salvo colpa provata da parte sua."]},{"h":"Wi-Fi","p":["Uso legale e ragionevole. La velocità può variare secondo le condizioni tecniche, il meteo o l’operatore."]}]},{"id":"securite","ico":"🆘","t":"Sicurezza e salute","hint":"Emergenze: 112","lead":"I numeri e i riflessi utili — sperando che non vi servano mai.","b":[{"h":"Numeri di emergenza","ul":["Julien & Stéphanie: +33 6 72 87 16 97","112: emergenze europee · 15: SAMU · 18: vigili del fuoco · 114: via SMS (non udenti)","In caso di evacuazione, punto di raccolta: l’ingresso della proprietà"]},{"h":"Salute a due passi","ul":["Studio medico du Peyron (600 m): +33 4 93 24 94 88","Farmacia du Peyron (600 m): +33 4 93 24 90 14 · farmacia di turno: 3237","Pronto soccorso 24 h: Polyclinique Saint-Jean, Cagnes-sur-Mer (25 min): +33 4 92 13 53 13","Emergenze pediatriche: CHU-Lenval, Nizza — chiamate prima il 15","Veterinario des Baous (1 km): +33 4 93 59 30 72"]},{"h":"L’estate in Costa Azzurra","ul":["Rischio di incendi boschivi: l’accesso ai rilievi può essere regolamentato, informatevi prima di un’escursione","Ondate di calore: portate acqua ed evitate sforzi nelle ore più calde","Bagni in fiume: prudenza, la portata può salire rapidamente"]}]},{"id":"depart","ico":"👋","t":"Il giorno della partenza","hint":"Entro le 11","lead":"Liberate la camera tra le 8:30 e le 11 — e partite a cuor leggero.","b":[{"ul":["Diteci il vostro orario approssimativo di partenza","Finestre chiuse, climatizzazione spenta","Consegnateci le chiavi di persona o lasciatele nella cassetta","La spazzatura? Ce ne occupiamo noi","Nient’altro: siete nostri ospiti fino all’ultimo minuto"]},{"note":"Una recensione del vostro soggiorno ci aiuta moltissimo — il link è in fondo alla pagina. Grazie!"}]}]},"cats":[{"id":"restos","ico":"🍽️","l":{"fr":"Où manger","en":"Where to eat","es":"Dónde comer","de":"Wo essen","it":"Dove mangiare"}},{"id":"patrimoine","ico":"🏛️","l":{"fr":"Villages & culture","en":"Villages & culture","es":"Pueblos y cultura","de":"Dörfer & Kultur","it":"Borghi e cultura"}},{"id":"nature","ico":"🌿","l":{"fr":"Nature & balades","en":"Nature & walks","es":"Naturaleza y paseos","de":"Natur & Wandern","it":"Natura e passeggiate"}},{"id":"plages","ico":"🏖️","l":{"fr":"Plages","en":"Beaches","es":"Playas","de":"Strände","it":"Spiagge"}},{"id":"marches","ico":"🧺","l":{"fr":"Marchés","en":"Markets","es":"Mercados","de":"Märkte","it":"Mercati"}},{"id":"commerces","ico":"🛒","l":{"fr":"Commerces","en":"Shops","es":"Comercios","de":"Einkaufen","it":"Negozi"}},{"id":"sante","ico":"⚕️","l":{"fr":"Santé","en":"Health","es":"Salud","de":"Gesundheit","it":"Salute"}},{"id":"transports","ico":"🚗","l":{"fr":"Transports","en":"Getting around","es":"Transporte","de":"Unterwegs","it":"Trasporti"}}],"places":[{"n":"L’Auberge des 4 Chemins","c":"restos","min":1,"km":0.4,"walk":5,"q":"L'Auberge des 4 Chemins, chemin du Peyron, Saint-Jeannet","tel":"+33493249001","d":{"fr":"Pizzas et cuisine niçoise, à 300 m de l’Auberge : notre voisine, accessible à pied.","en":"Pizzas and Niçois cooking, 300 m from the Auberge — our neighbour, an easy walk.","es":"Pizzas y cocina nizarda a 300 m de la Auberge: nuestra vecina, se va a pie.","de":"Pizza und Nizzaer Küche, 300 m von der Auberge – unsere Nachbarin, gut zu Fuß erreichbar.","it":"Pizze e cucina nizzarda a 300 m dall’Auberge: la nostra vicina, raggiungibile a piedi."}},{"n":"La Guinguette Gaudoise","c":"restos","min":5,"km":2.3,"q":"La Guinguette Gaudoise, route de Cagnes, La Gaude","tel":"+33493244207","web":"https://www.restaurant-laguinguette-gaudoise.fr/","d":{"fr":"Institution provençale depuis 1973 : beignets de fleurs de courgette, petits farcis, raviolis maison.","en":"A Provençal institution since 1973: courgette-flower fritters, petits farcis, homemade ravioli.","es":"Institución provenzal desde 1973: buñuelos de flor de calabacín, petits farcis, raviolis caseros.","de":"Provenzalische Institution seit 1973: Zucchiniblüten-Beignets, Petits Farcis, hausgemachte Ravioli.","it":"Istituzione provenzale dal 1973: fiori oute de Gattières, Saint-Jeannet","tel":"+33493329265","web":"https://levidence-restaurant.fr/","d":{"fr":"Cuisine soignée au quartier du Peyron, à deux minutes de l’Auberge.","en":"Carefully crafted cooking in the Peyron quarter, two minutes from the Auberge.","es":"Cocina cuidada en el barrio del Peyron, a dos minutos de la Auberge.","de":"Gepflegte Küche im Viertel Peyron, zwei Minuten von der Auberge.","it":"Cucina curata nel quartiere del Peyron, a due minuti dall’Auberge."}},{"n":"Au Vieuch Pizza","c":"restos","min":18,"km":8.5,"q":"Au Vieuch Pizza, rue Desjobert, Saint-Laurent-du-Var","tel":"+33624265981","d":{"fr":"Pizzas artisanales à pâte longue fermentation, dans le vieux village de Saint-Laurent-du-Var.","en":"Artisan pizzas with slow-fermented dough, in the old village of Saint-Laurent-du-Var.","es":"Pizzas artesanales de masa de larga fermentación, en el casco viejo de Saint-Laurent-du-Var.","de":"Handwerkliche Pizza mit lang fermentiertem Teig, im alten Ortskern von Saint-Laurent-du-Var.","it":"Pizze artigianali a lunga lievitazione, nel borgo vecchio di Saint-Laurent-du-Var."}},{"n":"Le Bateau Ivre","c":"restos","min":22,"km":11.0,"q":"Le Bateau Ivre, quai de la Pérouse, Saint-Laurent-du-Var","tel":"+33664201873","d":{"fr":"Cuisine méditerranéenne en terrasse, au port de Saint-Laurent-du-Var.","en":"Mediterranean cooking on a terrace at Saint-Laurent-du-Var’s marina.","es":"Cocina mediterránea en terraza, en el puerto de Saint-Laurent-du-Var.","de":"Mediterrane Küche auf der Terrasse am Hafen von Saint-Laurent-du-Var.","it":"Cucina mediterranea in terrazza, al porto di Saint-Laurent-du-Var."}},{"n":"Les Bacchanales","c":"restos","min":14,"km":6.5,"q":"Les Bacchanales, avenue de Provence, Vence","web":"https://lesbacchanales.com/","d":{"fr":"La grande table gastronomique de Vence, autour du végétal et du marché.","en":"Vence’s standout gastronomic restaurant, built around vegetables and the market.","es":"La gran mesa gastronómica de Vence, en torno a lo vegetal y el mercado.","de":"Das große Gourmetrestaurant von Vence, rund um Gemüse und Markt.","it":"La grande tavola gastronomica di Vence, tra vegetale e mercato."}},{"n":"Saint-Jeannet","c":"patrimoine","min":6,"km":2.5,"q":"Saint-Jeannet village","d":{"fr":"Le village perché au pied du Baou : ruelles, placettes, caves vigneronnes et points de vue.","en":"The hilltop village at the foot of the Baou: lanes, little squares, winegrowers’ cellars and viewpoints.","es":"El pueblo encaramado al pie del Baou: callejuelas, plazoletas, bodegas y miradores.","de":"Das Bergdorf am Fuß des Baou: Gassen, kleine Plätze, Winzerkeller und Aussichtspunkte.","it":"Il borgo arroccato ai piedi del Baou: vicoli, piazzette, cantine e punti panoramici."}},{"n":"La Gaude village","c":"patrimoine","min":6,"km":3.0,"q":"La Gaude centre village","d":{"fr":"Notre village : le « Vieuch », la place du Centenaire, et une vraie vie locale à l’année.","en":"Our village: the “Vieuch” old quarter, the Place du Centenaire, and real local life all year round.","es":"Nuestro pueblo: el «Vieuch», la plaza del Centenaire y auténtica vida local todo el año.","de":"Unser Dorf: das alte Viertel „Vieuch“, die Place du Centenaire und echtes Dorfleben das ganze Jahr.","it":"Il nostro paese: il «Vieuch», la place du Centenaire e una vera vita locale tutto l’anno."}},{"n":"Vence","c":"patrimoine","min":13,"km":6.5,"q":"Vence vieille ville","d":{"fr":"Cité historique, cathédrale, remparts — et la chapelle du Rosaire décorée par Matisse (fermée le dimanche).","en":"Historic town, cathedral, ramparts — and the Rosary Chapel decorated by Matisse (closed on Sundays).","es":"Ciudad histórica, catedral, murallas — y la capilla del Rosario decorada por Matisse (cerrada los domingos).","de":"Historische Stadt, Kathedrale, Stadtmauern – und die von Matisse gestaltete Rosenkranzkapelle (sonntags geschlossen).","it":"Città storica, cattedrale, mura — e la cappella del Rosario decorata da Matisse (chiusa la domenica)."}},{"n":"Saint-Paul-de-Vence","c":"patrimoine","min":17,"km":9.5,"q":"Saint-Paul-de-Vence","d":{"fr":"Le village d’artistes le plus célèbre de la Côte, remparts et galeries. Allez-y tôt le matin.","en":"The Riviera’s most famous artists’ village, ramparts and galleries. Go early in the morning.","es":"El pueblo de artistas más famoso de la Costa Azul, murallas y galerías. Vayan temprano.","de":"Das berühmteste Künstlerdorf der Riviera, Stadtmauern und Galerien. Am besten früh morgens.","it":"Il borgo d’artisti più celebre della Costa, mura e gallerie. Andateci di mattina presto."}},{"n":"Fondation Maeght","c":"patrimoine","min":17,"km":9.5,"q":"Fondation Maeght, Saint-Paul-de-Vence","tel":"+33493328163","web":"https://www.fondation-maeght.com/","d":{"fr":"Miró, Giacometti, Chagall dans un écrin moderniste au-dessus de Saint-Paul. Ouvert tous les jours.","en":"Miró, Giacometti and Chagall in a modernist setting above Saint-Paul. Open daily.","es":"Miró, Giacometti y Chagall en un marco modernista sobre Saint-Paul. Abierto a diario.","de":"Miró, Giacometti und Chagall in einem modernistischen Rahmen über Saint-Paul. Täglich geöffnet.","it":"Miró, Giacometti e Chagall in una cornice modernista sopra Saint-Paul. Aperto tutti i giorni."}},{"n":"Tourrettes-sur-Loup","c":"patrimoine","min":22,"km":13.0,"q":"Tourrettes-sur-Loup","d":{"fr":"La cité des violettes : village médiéval intact et ateliers d’artisans d’art.","en":"The city of violets: an intact medieval village full of craft workshops.","es":"La ciudad de las violetas: pueblo medieval intacto y talleres de artesanía.","de":"Die Stadt der Veilchen: intaktes mittelalterliches Dorf voller Kunsthandwerker.","it":"La città delle violette: borgo medievale intatto e botteghe artigiane."}},{"n":"Haut-de-Cagnes & musée Renoir","c":"patrimoine","min":22,"km":12.0,"q":"Haut-de-Cagnes, Cagnes-sur-Mer","tel":"+33493206107","d":{"fr":"Le vieux Cagnes autour du château Grimaldi, et la maison-atelier de Renoir aux Collettes (fermé /* 4 applications de navigation — liens dans le MÊME onglet (retour = livret) */
function navLinks(dest){
  const q = encodeURIComponent(dest);
  const L = [
    ['Google Maps', 'https://www.google.com/maps/dir/?api=1&destination=' + q + '&travelmode=driving'],
    ['Waze', 'https://waze.com/ul?q=' + q + '&navigate=yes'],
    ['Plans', 'https://maps.apple.com/?daddr=' + q + '&dirflg=d'],
    ['Mappy', 'https://fr.mappy.com/plan#/recherche/' + q]
  ];
  return isIOS ? [L[2], L[0], L[1], L[3]] : L;
}
function navGrid(dest){
  return '<div class="navgrid">' + navLinks(dest).map(x =>
    '<a href="' + x[1] + '">' + x[0] + '</a>').join('') + '</div>';
}

function pageCourante(){
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return null;
  if (h === 'autour') return 'autour';
  return (DATA.sections.fr.some(s => s.id === h)) ? h : null;
}

function rLangs(){

}
function blocs(s){
  let corps = '';
  (s.b || []).forEach(b => {
    if (b.h) corps += '<h3>'+esc(b.h)+'</h3>';
    (b.p || []).forEach(p => corps += '<p>'+esc(p)+'</p>');
    if (b.ul) corps += '<ul>'+b.ul.map(li => '<li>'+esc(li)+'</li>').join('')+'</ul>';
    if (b.note) corps += '<div class="note">'+esc(b.note)+'</div>';
  });
  return corps;
}

  const ui = DATA.ui[lang];
  const secs = DATA.sections[lang] || DATA.sections.fr;
  const bienv = secs[0];
  let h = '<div class="hero"><span class="surtitre">'+esc(ui.tagline)+' <em>/</em> La Gaude</span>'+
    '<h1 class="grand">'+esc(bienv.t)+'</h1><div class="adr">359 chemin de Provence · 06610 La Gaude</div></div>';
  h += bandeau('accueil');
  h += '<div class="facts">'+ui.facts.map(f => '<div class="fact"><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>').join('')+'</div>';
  h += '<div class="wifi"><h2>📶 '+esc(ui.wifiTitle)+'</h2>'+
    '<div class="lig"><b>'+esc(ui.wifiNet)+'</b><span class="val">'+esc(DATA.meta.wifiSsid)+'</span></div>'+
    '<div class="lig"><b>'+esc(ui.wifiPass)+'</b><span class="val">'+esc(DATA.meta.wifiMdp)+'</span></div>'+
    '<div class="btns"><button id="w-copy" type="button">'+esc(ui.copy)+'</button>'+
    '<button id="w-qr" type="button" class="ghost">'+esc(ui.wifiQrShow)+'</button></div>'+
    '<div class="wqr" id="wqr">'+QR_WIFI+'<p>'+esc(ui.wifiQrHint)+'</p></div></div>';
  h += '<div class="rentrer"><h2>'+esc(ui.returnTitle)+'</h2><p>'+esc(ui.returnLead)+'</p>'+
    '<div class="adl">'+esc(ui.addressLabel)+'</div><div class="adv">'+esc(DATA.meta.adresse)+'</div>'+
    navGrid(DATA.meta.gps[0]+','+DATA.meta.gps[1])+'</div>';
  h += '<nav class="menu"><span class="surtitre">'+esc(ui.menuTitle)+'</span>';
  h += secs.map(s => '<a class="carte-nav" href="#/'+s.id+'"><span class="ico">'+s.ico+'</span>'+
    '<span class="tt"><h2>'+esc(s.t)+'</h2>'+(s.hint?'<span class="hint">'+esc(s.hint)+'</span>':'')+'</span>'+
    '<span class="chev">›</span></a>').join('');
  h += '<a class="carte-nav" href="#/autour"><span class="ico">🧭</span><span class="tt"><h2>'+esc(ui.aroundTitle)+'</h2>'+
    '<span class="hint">'+places.length+' ★</span></span><span class="chev">›</span></a>';
  h += '</nav>';
  return h;
}
function vueSection(id){
  const ui = DATA.ui[lang];
  const secs = DATA.sections[lang] || DATA.sections.fr;
  const s = secs.find(x => x.id === id);
  let h = '<div class="retour"><button type="button" id="btn-retour">← '+esc(ui.back)+'</button></div>';
  h += '<div class="page-tete"><span class="surtitre">L’Attrape-Rêves <em>/</em> '+esc(s.hint || '')+'</span>'+
    '<h1 class="grand">'+s.ico+' '+esc(s.t)+'</h1>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+'</div>';
  h += bandeau(id);
  h += '<div class="corps">'+blocs(s)+'</div>';
  return h;
}
function carteLieu(p){
  const ui = DATA.ui[lang];
  let dist = '';
  if (p.walk) dist = p.walk+' '+ui.minShort+' '+ui.onFoot;
  else if (p.min) dist = p.min+' '+ui.minShort+' '+ui.byCar+(p.km?' · '+String(p.km).replace('.',',')+' km':'');
  let act = '';
  if (p.tel) act += '<a class="sec" href="'+telHref(p.tel)+'">📞 '+esc(ui.call)+'</a>';
  if (p.web) act += '<a class="sec" href="'+esc(p.web)+'">🌐 '+esc(ui.web)+'</a>';
  if (p.q)   act += '<details class="nav"><summary>🧭 '+esc(ui.route)+'</summary>'+
    '<div class="lbl">'+esc(ui.goThere)+'</div>'+navGrid(p.q)+'</details>';
  return '<article class="lieu"><div class="lt"><h3>'+esc(p.n)+'</h3>'+(dist?'<span class="dist">'+esc(dist)+'</span>':'')+'</div>'+
    '<p>'+esc(p.d[lang]||p.d.fr||'')+'</p>'+(act?'<div class="actions">'+act+'</div>':'')+'</article>';
}
function listeLieux(){
  const ui = DATA.ui[lang];
  const f = filtre.trim().toLowerCase();
  const vis = places.filter(p =>
    (catActive==='tous' || p.c===catActive) &&
    (!f || p.n.toLowerCase().includes(f) || ((p.d[lang]||p.d.fr||'').toLowerCase().includes(f))));
  return vis.length ? vis.map(carteLieu).join('') : '<div class="vide">'+esc(ui.noResult)+'</div>';
}
function vueAutour(){
  const ui = DATA.ui[lang];
  let h = '<div class="retour"><button type="button" id="btn-retour">← '+esc(ui.back)+'</button></div>';
  h += '<div class="page-tete"><span class="surtitre">L’Attrape-Rêves <em>/</em> '+esc(ui.menuTitle)+'</span>'+
    '<h1 class="grand">🧭 '+esc(ui.aroundTitle)+'</h1><p class="lead">'+esc(ui.aroundLead)+'</p></div>';
  h += bandeau('autour');
  h += '<div class="chips" id="chips"><button type="button" data-c="tous" aria-pressed="'+(catActive==='tous')+'">'+esc(ui.allCats)+'</button>'+
    DATA.cats.map(c => '<button type="button" data-c="'+c.id+'" aria-pressed="'+(catActive===c.id)+'">'+c.ico+' '+esc(c.l[lang]||c.l.fr)+'</button>').join('')+'</div>';
  h += '<input class="cherche" id="cherche" type="search" placeholder="'+esc(ui.searchPh)+'" value="'+esc(filtre)+'">';
  h += '<div id="lieux">'+listeLieux()+'</div>';
  h += '<p class="approx">'+esc(ui.approx)+'</p>';
  return h;
}
function rFooter(){
  const ui = DATA.ui[lang];
  $('#f-titre').textContent = ui.contactTitle; $('#f-lead').textContent = ui.contactLead;
  $('#f-tel').href = telHref(DATA.meta.tel); $('#f-tel').textContent = '📞 ' + DATA.meta.telAff;
  $('#f-mail').href = 'mailto:' + DATA.meta.email; $('#f-mail').textContent = '✉️ ' + ui.writeUs;
  $('#f-maps').href = 'https://www.google.com/maps/search/?api=1&query=' + DATA.meta.gps[0] + ',' + DATA.meta.gps[1];
  $('#f-maps').textContent = '📍 ' + ui.openMaps;
  $('#f-avis').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent("L'Attrape-Rêves " + DATA.meta.adresse);
  $('#f-avis').textContent = '⭐ ' + ui.review;
}
function rendre(){
  document.documentElement.lang = lang;
  rLangs(); rFooter();
  const p = pageCourante();
  $('#vue').innerHTML = p === 'autour' ? vueAutour() : (p ? vueSection(p) : vueAccueil());
  $('#haut').setAttribute('aria-label', DATA.ui[lang].toTop);
  window.scrollTo(0, 0);
}
window.addEventListener('scroll', () => {
  $('#haut').classList.toggle('on', window.scrollY > 420);
}, { passive: true });

/* ---------- événements ---------- */
window.addEventListener('hashchange', rendre);
document.addEventListener('click', ev => {
  const lb = ev.target.closest('#langs button');
  if (lb) { lang = lb.dataset.l; try { localStorage.setItem(KEY, lang); } catch(e){}; rendre(); return; }
  const cb = ev.target.closest('#chips button');
  if (cb) { catActive = cb.dataset.c;
    document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === catActive));
    $('#lieux').innerHTML = listeLieux(); return; }
  if (ev.target.id === 'btn-retour') {
    if (history.length > 1) history.back(); else location.hash = '';
    return;
  }
  if (ev.target.id === 'haut') { window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (ev.target.id === 'w-qr') {
    const ui = DATA.ui[lang], pan = $('#wqr');
    pan.classList.toggle('on');
    ev.target.textContent = pan.classList.contains('on') ? ui.wifiQrHide : ui.wifiQrShow;
    return;
  }
  if (ev.target.id === 'w-copy') {
    const ui = DATA.ui[lang];
    const fin = ok => { const b = $('#w-copy'); if (!b) return;
      b.textContent = ok ? ui.copied : ui.copy; setTimeout(() => { const b2 = $('#w-copy'); if (b2) b2.textContent = ui.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(DATA.meta.wifiMdp).then(() => fin(true), () => fin(false));
    else fin(false);
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'cherche') { filtre = ev.target.value; $('#lieux').innerHTML = listeLieux(); }
});

/* Chargement distant (phase WordPress uniquement) — repli embarqué sinon.
   Validation stricte : rejet total si plus de 10 % d'enregistrements malformés.
   Fusion PAR NOM, jamais par index. Aucune erreur n'est montrée au voyageur. */
function valide(p){
  return p && typeof p.n==='string' && p.n.trim() && typeof p.c==='string' &&
         p.d && typeof p.d==='object' && typeof (p.d.fr||p.d.en)==='string';
}
if (API_BASE) {
  const controle = new AbortController();
  const chrono = setTimeout(() => controle.abort(), 4000);
  fetch(API_BASE + 'lieux', { signal: controle.signal, cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(arr => {
      clearTimeout(chrono);
      if (!Array.isArray(arr) || !arr.length) return;
      const ok = arr.filter(valide);
      if (ok.length < arr.length * 0.9) return;          // >10 % malformés → repli
      const parNom = new Map(ok.map(p => [p.n, p]));
      places = DATA.places.map(p => parNom.get(p.n) || p);
      ok.forEach(p => { if (!DATA.places.some(e => e.n === p.n)) places.push(p); });
      if (pageCourante() === 'autour') rendre();
    })
    .catch(() => {});                                     // silence : le repli suffit
}

rendre();
</script>
</body>
</html>
